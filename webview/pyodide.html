<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyodide Python Runner</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #status {
      padding: 10px;
      text-align: center;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="status">Loading Python runtime...</div>

  <script>
    let pyodide = null;
    let isReady = false;
    let pendingMessages = [];

    // Initialize Pyodide
    async function initPyodide() {
      try {
        document.getElementById('status').textContent = 'Loading Pyodide...';

        pyodide = await loadPyodide({
          indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'
        });

        // Redirect Python stdout/stderr
        await pyodide.runPythonAsync(`
import sys
import io

class OutputCapture:
    def __init__(self):
        self.stdout = io.StringIO()
        self.stderr = io.StringIO()

    def reset(self):
        self.stdout = io.StringIO()
        self.stderr = io.StringIO()

    def get_stdout(self):
        return self.stdout.getvalue()

    def get_stderr(self):
        return self.stderr.getvalue()

output_capture = OutputCapture()
        `);

        isReady = true;
        document.getElementById('status').textContent = 'Python runtime ready';

        // Notify React Native that Pyodide is ready
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({
            type: 'ready'
          }));
        }

        // Process any pending messages
        while (pendingMessages.length > 0) {
          const msg = pendingMessages.shift();
          await handleMessage(msg);
        }

      } catch (error) {
        console.error('Failed to initialize Pyodide:', error);
        document.getElementById('status').textContent = 'Failed to load Python runtime';

        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({
            type: 'error',
            message: 'Failed to initialize Pyodide: ' + error.message
          }));
        }
      }
    }

    // Handle messages from React Native
    async function handleMessage(event) {
      try {
        const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        const { code, id, input } = data;

        if (!id || !code) {
          console.error('Invalid message format:', data);
          return;
        }

        // If Pyodide is not ready yet, queue the message
        if (!isReady) {
          pendingMessages.push(event);
          return;
        }

        const startTime = Date.now();

        // Reset output capture
        await pyodide.runPythonAsync('output_capture.reset()');

        // Redirect stdout and stderr
        await pyodide.runPythonAsync(`
sys.stdout = output_capture.stdout
sys.stderr = output_capture.stderr
        `);

        try {
          // Run the user's Python code
          const result = await pyodide.runPythonAsync(code);

          // Get captured output
          const stdout = await pyodide.runPythonAsync('output_capture.get_stdout()');
          const stderr = await pyodide.runPythonAsync('output_capture.get_stderr()');

          const executionTime = Date.now() - startTime;

          // Send result back to React Native
          if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify({
              type: 'result',
              id: id,
              stdout: stdout || '',
              stderr: stderr || '',
              success: true,
              executionTime: executionTime
            }));
          }

        } catch (error) {
          // Get any output before the error
          const stdout = await pyodide.runPythonAsync('output_capture.get_stdout()');
          const stderr = await pyodide.runPythonAsync('output_capture.get_stderr()');

          const executionTime = Date.now() - startTime;

          // Send error back to React Native
          if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify({
              type: 'result',
              id: id,
              stdout: stdout || '',
              stderr: (stderr || '') + '\n' + error.message,
              success: false,
              executionTime: executionTime
            }));
          }
        }

        // Restore stdout and stderr
        await pyodide.runPythonAsync(`
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
        `);

      } catch (error) {
        console.error('Error handling message:', error);

        if (window.ReactNativeWebView && data && data.id) {
          window.ReactNativeWebView.postMessage(JSON.stringify({
            type: 'result',
            id: data.id,
            stdout: '',
            stderr: 'Internal error: ' + error.message,
            success: false
          }));
        }
      }
    }

    // Listen for messages from React Native
    window.addEventListener('message', handleMessage);
    document.addEventListener('message', handleMessage); // For iOS

    // Initialize Pyodide when the page loads
    initPyodide();
  </script>
</body>
</html>
